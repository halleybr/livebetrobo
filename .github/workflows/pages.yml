name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # GitHub Actions: intervalo mínimo de 5 min.
    # Deslocado para :02/:07/... para evitar os picos de fila no início de cada
    # hora e meia-hora (atrasos documentados pelo GitHub em horários de carga).
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate scanner data
        run: python build.py
        env:
          MIN_LPS: "70"

      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site/static _site/api
          cp static/index.html _site/index.html
          cp static/style.css static/app.js _site/static/
          cp api/scanner.json _site/api/scanner.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
